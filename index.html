<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alexis Bourgeois · AcidyBee</title>
<meta name="description" content="Alexis Bourgeois (AcidyBee) – data scientist senior et biostatisticien à Montpellier : fiabilisation de données, modélisation statistique, analyse spatiale, applications Shiny.">
<meta property="og:type" content="website">
<meta property="og:title" content="Alexis Bourgeois · AcidyBee">
<meta property="og:description" content="Data scientist senior et biostatisticien : fiabilisation de données, modélisation statistique, analyse spatiale, applications Shiny.">
<meta property="og:url" content="https://acidybee.github.io/">
<meta property="og:image" content="https://acidybee.github.io/img/og-card.jpg">

<meta name="theme-color" content="#E8A11C">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one sticky header, hash-routed views; each view = centered 1120px column.
   Brand motif = the hexagon (AcidyBee's honeycomb, the statistician's hexbin). */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --ink:#18232B; --muted:#56646E; --line:#DCE2E6;
  --honey:#E8A11C; --honey-ink:#94590A; --honey-soft:#FBEFD4; --slate:#24495A; --slate-soft:#E3ECF0;
  --hex-lo:#FBEBC6; --hex-hi:#7A4406; --on-honey:#1B1406;
  --shadow:0 1px 2px rgba(24,35,43,.06),0 8px 24px rgba(24,35,43,.06); --band-bg:#24495A; --band-fg:#F3F5F6; --band-muted:#C9D7DE;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --maxw:1120px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162027; --ink:#E6ECEF; --muted:#9BA9B2; --line:#28343C;
  --honey:#F2B23A; --honey-ink:#F5BE57; --honey-soft:#33270F; --slate:#9CC2D3; --slate-soft:#1C2B33;
  --hex-lo:#2C2412; --hex-hi:#FFC85A; --on-honey:#1B1406;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --band-bg:#1B3340; --band-fg:#E6ECEF; --band-muted:#AFC3CD; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --ink:#E6ECEF; --muted:#9BA9B2; --line:#28343C;
  --honey:#F2B23A; --honey-ink:#F5BE57; --honey-soft:#33270F; --slate:#9CC2D3; --slate-soft:#1C2B33;
  --hex-lo:#2C2412; --hex-hi:#FFC85A; --on-honey:#1B1406;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --band-bg:#1B3340; --band-fg:#E6ECEF; --band-muted:#AFC3CD; color-scheme:dark;}

*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--honey-ink);text-underline-offset:3px}
a:hover{color:var(--ink)}
:focus-visible{outline:2.5px solid var(--honey);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,5.2vw,3.7rem);font-weight:800}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--honey-ink);font-weight:500}
.lead{font-size:1.15rem;color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.prose{max-width:66ch;display:grid;gap:1em}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.05rem;display:block;line-height:1.1}
.brand small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:block}
nav.main{display:flex;gap:2px}
nav.main a{font-size:.94rem;text-decoration:none;color:var(--muted);padding:8px 11px;border-radius:999px;font-weight:500}
nav.main a:hover{color:var(--ink);background:var(--slate-soft)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--honey-soft)}
.tools{display:flex;gap:6px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:500 .8rem var(--f-mono);background:none;border:0;padding:6px 10px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;color:var(--ink);cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:grid;place-items:center}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main a{padding:12px 14px;border-radius:10px;font-size:1rem}
}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 .95rem var(--f-body);text-decoration:none;padding:11px 18px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;transition:transform .15s ease,background .15s}
.btn:hover{transform:translateY(-1px);background:var(--slate-soft);color:var(--ink)}
.btn.primary{background:var(--honey);border-color:var(--honey);color:var(--on-honey)}
.btn.primary:hover{background:color-mix(in srgb,var(--honey) 85%,var(--ink))}
.btn svg{width:18px;height:18px;flex:none}

/* views */
main{padding-block:0 72px}
.view{display:none}
.view.active{display:block;animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
section.block{padding-block:56px 0}
.sec-head{display:grid;gap:10px;margin-bottom:28px}

/* hero */
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:44px;align-items:center;padding-block:56px 8px}
.hero > *{min-width:0}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--honey-soft) 62%)}
.hero .copy{display:grid;gap:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:.76rem;padding:4px 10px;border-radius:999px;background:var(--slate-soft);color:var(--slate)}
.hexcard{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.hexhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.hexhead .eyebrow{font-size:.72rem}
.hexcode{font:500 .8rem var(--f-mono);white-space:nowrap}
.hexbody{display:grid;grid-template-columns:minmax(0,1fr) 176px;gap:16px;align-items:start}
.hexplot{position:relative;min-width:0}
.hexplot canvas{display:block;width:100%;aspect-ratio:.6;max-height:520px;max-width:100%;touch-action:pan-y}
.hexside{display:grid;gap:14px;align-content:start;min-width:0}
.hexchips{display:grid;gap:6px}
.hchip{display:flex;justify-content:space-between;gap:8px;align-items:center;font:500 .84rem var(--f-body);text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;cursor:pointer}
.hchip:hover{border-color:var(--honey)}
.hchip b{font:500 .76rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.hchip[aria-pressed="true"]{border-color:var(--honey);background:var(--honey-soft)}
.hchip[aria-pressed="true"] b{color:var(--honey-ink)}
.hexleg{display:grid;gap:5px;font:500 .72rem var(--f-mono);color:var(--muted)}
.hexleg .bar{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--hex-lo),var(--hex-hi))}
.hexleg .ends{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.hexsum{font:500 .76rem var(--f-mono);color:var(--muted)}
.hexcard figcaption{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);padding-top:10px;border-top:1px dashed var(--line)}
.hextip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font:500 .75rem var(--f-mono);padding:4px 8px;border-radius:6px;transform:translate(-50%,-130%);white-space:nowrap;z-index:2}
@media (max-width:560px){.hexbody{grid-template-columns:1fr}.hexchips{grid-template-columns:repeat(2,minmax(0,1fr))}.hexplot canvas{aspect-ratio:.62;max-height:64vh}}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:28px;padding-top:36px}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:20px 18px;border-right:1px solid var(--line);display:grid;gap:4px}
.stat:last-child{border-right:0}
.stat b{font-family:var(--f-display);font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.88rem;color:var(--muted);line-height:1.35}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}.stat:nth-child(2n){border-right:0}.stat:last-child{grid-column:1/-1;border-bottom:0}}

/* audiences */
.aud{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.aud article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:10px;align-content:start}
.aud .hexico{width:40px;height:44px}
.aud ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:.95rem;display:grid;gap:4px}
@media (max-width:860px){.aud{grid-template-columns:1fr}}

/* atypical band */
.band{background:var(--band-bg);color:var(--band-fg);border-radius:calc(var(--r) + 4px);padding:36px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.band h2{color:var(--band-fg)}
.band p,.band li span{color:var(--band-muted)}
.band .btn{border-color:var(--band-fg);color:var(--band-fg)}
.band .btn:hover{background:color-mix(in srgb,var(--band-fg) 14%,transparent);color:var(--band-fg)}
.band ol{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.band li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.band li b{font-family:var(--f-mono);font-size:.8rem;background:var(--honey);color:var(--on-honey);border-radius:6px;padding:2px 7px;margin-top:3px}
@media (max-width:860px){.band{grid-template-columns:1fr;padding:26px 20px}}

/* project cards */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{font:500 .86rem var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);transition:transform .18s ease,box-shadow .18s ease}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);color:var(--ink)}
.pcard .thumb{aspect-ratio:16/10;background:#fff;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.pcard .thumb img{width:100%;height:100%;object-fit:contain;padding:10px}
.pcard .thumb.photo img{object-fit:cover;padding:0}
.pcard .body{padding:18px;display:grid;gap:8px;flex:1;align-content:start}
.pcard .dom{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--honey-ink)}
.pcard p{color:var(--muted);font-size:.94rem}
.pcard .more{margin-top:auto;padding:0 18px 16px;font-weight:600;font-size:.9rem;color:var(--honey-ink)}

/* case study */
.case-head{display:grid;gap:16px;padding-block:44px 8px}
.back{font:500 .9rem var(--f-body);color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-block:1px solid var(--line);margin-top:10px}
.facts div{padding:14px 16px 14px 0;display:grid;gap:2px;min-width:0}
.facts dt{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts dd{margin:0;font-weight:500;font-size:.95rem}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.case-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;padding-top:36px}
@media (max-width:900px){.case-body{grid-template-columns:1fr;gap:28px}}
.steps{display:grid;gap:26px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px}
.step .hx{width:40px;height:44px;display:grid;place-items:center;font:600 .78rem var(--f-mono);color:var(--on-honey);background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.step h3{margin-bottom:6px}
.step p,.step li{color:var(--ink)}
.step ul{margin:6px 0 0;padding-left:1.1em;display:grid;gap:4px}
aside.side{display:grid;gap:16px;align-content:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.box h3{font-size:1rem}
.result{background:var(--honey-soft);border-color:transparent}
.result b{font-family:var(--f-display);font-size:1.5rem;display:block;line-height:1.15}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:40px}
.gallery figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.gallery button{all:unset;cursor:zoom-in;background:#fff;display:grid;place-items:center;aspect-ratio:4/3;border-bottom:1px solid var(--line)}
.gallery button:focus-visible{outline:2.5px solid var(--honey);outline-offset:-3px}
.gallery img{width:100%;height:100%;object-fit:contain;padding:10px}
.gallery figcaption{padding:10px 14px 12px;font-size:.86rem;color:var(--muted)}
.case-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,14,17,.86);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;max-width:min(1200px,100%);display:grid;gap:10px}
.lb img{background:#fff;border-radius:10px;max-height:78vh;width:auto;margin:0 auto;padding:12px}
.lb figcaption{color:#E6ECEF;text-align:center;font-size:.95rem}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:#fff;color:#18232B;border:0;border-radius:999px;width:42px;height:42px;font-size:1.3rem;cursor:pointer}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:start;padding-top:44px}
@media (max-width:900px){.about-grid{grid-template-columns:1fr;gap:28px}}
.photo{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.photo img{display:block;width:100%;height:auto}
.photo figcaption{padding:10px 14px;font-size:.86rem;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0;position:relative}
.tl li{display:grid;grid-template-columns:112px minmax(0,1fr);gap:18px;padding:16px 0;border-top:1px solid var(--line)}
.tl time{font-family:var(--f-mono);font-size:.82rem;color:var(--honey-ink);padding-top:2px;font-variant-numeric:tabular-nums}
.tl h3{font-size:1.05rem}
.tl p{color:var(--muted);font-size:.95rem}
@media (max-width:560px){.tl li{grid-template-columns:1fr;gap:4px}}
.proof{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.proof article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px;align-content:start}
.proof article p{color:var(--muted);font-size:.95rem}
@media (max-width:720px){.proof{grid-template-columns:1fr}}
.bridge{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.bridge div{padding:18px;border-right:1px solid var(--line);display:grid;gap:6px;align-content:start}
.bridge div:last-child{border-right:0}
.bridge b{font-family:var(--f-display);font-size:1.05rem}
.bridge span{font-size:.9rem;color:var(--muted)}
.bridge i{font-style:normal;font-family:var(--f-mono);font-size:.74rem;color:var(--honey-ink);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:820px){.bridge{grid-template-columns:1fr 1fr}.bridge div:nth-child(2){border-right:0}.bridge div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:460px){.bridge{grid-template-columns:1fr}.bridge div{border-right:0;border-bottom:1px solid var(--line)}.bridge div:last-child{border-bottom:0}}

/* skills */
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.88rem;color:var(--muted);margin-bottom:20px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lvl{display:inline-flex;gap:3px}
.lvl i{width:10px;height:11px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line)}
.lvl i.on{background:var(--honey)}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.skills{grid-template-columns:1fr}}
.sk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:14px;align-content:start}
.sk ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.sk li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.sk li small{display:block;color:var(--muted);font-size:.83rem;line-height:1.35}
.sk li a{font-size:.83rem}

/* publications */
.pubs{display:grid;gap:34px}
.pubgroup h3{margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.pubgroup h3 span{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:400}
.pub{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.pub .yr{font-family:var(--f-mono);font-size:.85rem;color:var(--honey-ink);padding-top:2px}
.pub .t{font-weight:600}

function renderCase(id){
 const i=CASES.findIndex(c=>c.id===id); if(i<0)return false;
 const c=CASES[i],S=T[lang],prev=CASES[(i-1+CASES.length)%CASES.length],next=CASES[(i+1)%CASES.length];

 $("#case").innerHTML=`

}

function route(){

 window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
 if(v==="home") drawHex();
}

const PAV_EXT=(()=>{let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;for(const p of PAV.pts){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}const m=900;return{x0:x0-m,x1:x1+m,y0:y0-m,y1:y1+m};})();
// Origine de la grille calée sur des kilomètres ronds (Lambert-93) : le résultat ne dépend pas de l'emprise affichée
const PAV_ORIG={x0:Math.floor((PAV_EXT.x0+900)/1000)*1000-1000,y1:Math.ceil((PAV_EXT.y1-900)/1000)*1000+1000};
const PAV_CACHE={};
let pavSel="ALL",hexState=null,hexAnim=0;
const fmt=(n)=>n.toLocaleString(lang==="fr"?"fr-FR":"en-GB");
function pavBins(code){
 // Hexagones « pointe en haut » : largeur entre côtés opposés = PAV.hex_largeur_m (1 km)
 const R=PAV.hex_largeur_m/Math.sqrt(3),ti=code==="ALL"?-1:PAV.types.findIndex(t=>t.code===code),bins=new Map();
 for(const p of PAV.pts){
  if(ti>=0&&p[2]!==ti)continue;
  const x=p[0]-PAV_ORIG.x0,y=PAV_ORIG.y1-p[1];
  const fq=(Math.sqrt(3)/3*x-y/3)/R,fr=(2/3*y)/R,fs=-fq-fr;
  let q=Math.round(fq),r=Math.round(fr),z=Math.round(fs);
  const dq=Math.abs(q-fq),dr=Math.abs(r-fr),dz=Math.abs(z-fs);
  if(dq>dr&&dq>dz)q=-r-z;else if(dr>dz)r=-q-z;
  const k=q+","+r;let b=bins.get(k);if(!b){b={q,r,n:0,c:{}};bins.set(k,b);}b.n++;b.c[p[3]]=(b.c[p[3]]||0)+1;
 }
 const dx=PAV_ORIG.x0-PAV_EXT.x0,dy=PAV_EXT.y1-PAV_ORIG.y1;
 return{R,cells:[...bins.values()].map(b=>({x:dx+R*Math.sqrt(3)*(b.q+b.r/2),y:dy+R*1.5*b.r,n:b.n,com:PAV.communes[+Object.entries(b.c).sort((u,v)=>v[1]-u[1])[0][0]]||""}))};
}
const getBins=(c)=>PAV_CACHE[c]||(PAV_CACHE[c]=pavBins(c));
function renderPavChips(){
 const S=T[lang],items=[["ALL",S["hex.all"],PAV.pts.length],...PAV.types.map(t=>[t.code,t[lang],t.n])];
 $("#hexchips").innerHTML=items.map(([c,l,n])=>`<button type="button" class="hchip" id="pav-${c}" data-pav="${c}" aria-pressed="${c===pavSel}"><span>${esc(l)}</span><b>${fmt(n)}</b></button>`).join("");
 $("#hexchips").setAttribute("aria-label",S["hex.filter"]);
}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function mix(a,b,t){const p=s=>{s=s.replace("#","");return[0,2,4].map(i=>parseInt(s.slice(i,i+2),16))};const A=p(a),B=p(b);return"rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")"}
function hexPath(ctx,x,y,r){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);ctx[i?"lineTo":"moveTo"](x+r*Math.cos(a),y+r*Math.sin(a));}ctx.closePath();}
function drawHex(animate){
 const cv=$("#hex");if(!cv||!cv.offsetParent)return;
 const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
 const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
 const wm=PAV_EXT.x1-PAV_EXT.x0,hm=PAV_EXT.y1-PAV_EXT.y0,k=Math.min(W/wm,H/hm),ox=(W-wm*k)/2,oy=(H-hm*k)/2;
 const all=getBins("ALL"),cur=getBins(pavSel),rpx=cur.R*k*.93;
 const toPx=(c)=>({px:ox+c.x*k,py:oy+c.y*k,n:c.n,com:c.com});
 const cells=cur.cells.map(toPx).sort((a,b)=>a.py-b.py),ghost=pavSel==="ALL"?[]:all.cells.map(toPx);
 const max=Math.max(...cells.map(c=>c.n)),total=cells.reduce((a,c)=>a+c.n,0),S=T[lang];
 hexState={cells,rpx};
 $("#leg-hi").textContent=fmt(max);
 $("#hexsum").textContent=`${fmt(total)} ${total>1?S["hex.unitN"]:S["hex.unit1"]} · ${fmt(cells.length)} ${S["hex.cells"]}`;
 const label=pavSel==="ALL"?S["hex.all"]:PAV.types.find(t=>t.code===pavSel)[lang];
 cv.setAttribute("aria-label",`${S["hex.aria"]} : ${label}, ${fmt(total)} ${S["hex.unitN"]}`);
 const lo=cssVar("--hex-lo"),hi=cssVar("--hex-hi"),line=cssVar("--line");
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,dur=(animate&&!reduce)?550:0,t0=performance.now();
 cancelAnimationFrame(hexAnim);
 const frame=(now)=>{
  const pr=dur?Math.min(1,(now-t0)/dur):1;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=line;ctx.lineWidth=1;

  if(pr<1)hexAnim=requestAnimationFrame(frame);

}

const cv=$("#hex"),tip=$("#hextip");
function hexHover(e){

}
cv.addEventListener("pointermove",hexHover);
cv.addEventListener("pointerdown",hexHover);
cv.addEventListener("pointerleave",()=>tip.hidden=true);

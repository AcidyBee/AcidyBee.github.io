- title: Ingénieur application et R&D · Sopralab (Semilab), Bois-Colombes
  period: 2006 – 2012
  fr:
    title: Ingénieur application et R&D · Sopralab (Semilab), Bois-Colombes
    text: "D'octobre 2006 à 2012. Ellipsométrie et porosimétrie en environnement industriel international : analyse de données avec les logiciels WinElli et WinElli II, développement de dispositifs d'adsorption, formation de clients."
  en:
    title: Application & R&D engineer · Sopralab (Semilab), Bois-Colombes
    text: "October 2006 to 2012. Ellipsometry and porosimetry in an international industrial setting: data analysis with the WinElli and WinElli II software, development of adsorption set-ups, customer training."

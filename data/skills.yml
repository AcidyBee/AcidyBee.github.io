# Compétences, lues par skills.qmd. level : 1 = notions, 2 = maîtrisé, 3 = pratique quotidienne.
# case : identifiant d'une fiche projet (nom du fichier dans projects/, sans .qmd).
# « title » sert seulement à Quarto ; l'affichage utilise « group ».

- title: Statistique et modélisation
  group:
    fr: Statistique et modélisation
    en: Statistics and modelling
  skills:
    - name:
        fr: Statistiques descriptives et inférentielles
        en: Descriptive and inferential statistics
      note:
        fr: tests, intervalles de confiance, ANOVA
        en: tests, confidence intervals, ANOVA
      level: 3
      case: c5b9
    - name:
        fr: Régression linéaire et logistique
        en: Linear and logistic regression
      level: 3
      case: mapuce
    - name:
        fr: Analyse de survie
        en: Survival analysis
      note:
        fr: Kaplan-Meier, Cox, nomogrammes
        en: Kaplan-Meier, Cox, nomograms
      level: 3
      case: c5b9
    - name:
        fr: Modèles mixtes et GLS
        en: Mixed models and GLS
      note:
        fr: mesures répétées, structures de corrélation
        en: repeated measures, correlation structures
      level: 2
    - name:
        fr: Analyse multivariée
        en: Multivariate analysis
      note:
        fr: ACP, AFC, classification, segmentation
        en: PCA, CA, clustering, segmentation
      level: 3
      case: cigale
    - name:
        fr: Machine learning
        en: Machine learning
      note:
        fr: forêts aléatoires, gradient boosting, validation croisée
        en: random forests, gradient boosting, cross-validation
      level: 2
      case: mapuce
    - name:
        fr: Rééchantillonnage
        en: Resampling
      note:
        fr: bootstrap, validation croisée
        en: bootstrap, cross-validation
      level: 3
      case: mapuce
    - name:
        fr: Approches bayésiennes
        en: Bayesian methods
      note:
        fr: modèles hiérarchiques, inférence bayésienne
        en: hierarchical models, Bayesian inference
      level: 1
